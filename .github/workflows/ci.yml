name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The checkout token is not needed after this step; leaving it in the
          # git config would expose it to every later step.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Matches package.json engines, .node-version, and the Dockerfile.
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing workspace, not just the first.
      fail-fast: false
      matrix:
        workspace: [".", "backend", "frontend"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # Nothing checked this before, so vulnerable transitive dependencies
      # could reach production unnoticed.
      - name: npm audit (${{ matrix.workspace }})
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=high
