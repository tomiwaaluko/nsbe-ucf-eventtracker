version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nsbe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nsbe_user
      POSTGRES_PASSWORD: nsbe_password
      POSTGRES_DB: nsbe_eventtracker
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nsbe_user -d nsbe_eventtracker']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nsbe-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://nsbe_user:nsbe_password@postgres:5432/nsbe_eventtracker
      DIRECT_URL: postgresql://nsbe_user:nsbe_password@postgres:5432/nsbe_eventtracker
      # Supabase configuration
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Add your other environment variables here
      # SECURITY: no defaults on the signing secrets. These previously fell back
      # to "your-secret-key-change-in-production" and
      # "your-supabase-jwt-secret-change-in-production" -- publicly known
      # strings, in a service block labelled NODE_ENV: production. Anyone who
      # brought the stack up without a .env got a signing key an attacker could
      # look up in this repo and use to mint an admin token.
      #
      # `:?` makes compose refuse to start with a clear message instead.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (generate with: openssl rand -base64 48)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET must be set (copy from your Supabase project settings)}
      # OAuth credentials (add your actual values in .env)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH_CALLBACK_URL: ${OAUTH_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Required: this block sets NODE_ENV=production, and the app refuses to
      # boot in production without an explicit CORS allowlist. Defaulted to the
      # local frontend so `docker-compose up` still works out of the box.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node_modules/.bin/prisma migrate deploy && npm run start:prod"

volumes:
  postgres_data:
